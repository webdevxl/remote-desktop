[package]
name = "platform-mac"
version.workspace = true
edition.workspace = true

[dependencies]
protocol.workspace = true
anyhow.workspace = true
tracing.workspace = true
objc2-screen-capture-kit = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-foundation", "objc2-core-graphics"] }
dispatch2 = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface", "objc2-metal"] }
objc2-core-media = "0.3"
objc2-video-toolbox = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-graphics = { version = "0.3", features = ["libc"] }
libc = "0.2"
objc2-io-surface = "0.3"
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSPasteboard", "objc2-core-graphics", "objc2-core-foundation"] }

[dev-dependencies]
# Tests convert built gesture events with `NSEvent(cgEvent:)`, as AppKit would deliver them.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "objc2-core-graphics", "objc2-core-foundation"] }
