[package]
name = "lankvm-core"
version.workspace = true
edition.workspace = true

[lib]
name = "lankvm_core"
# staticlib: linked into the SwiftUI app. rlib: for `cargo test`.
crate-type = ["staticlib", "rlib"]

# `cargo test` only builds examples unless told otherwise; the probe's tests check the e2e
# scenario scripts, so they run with everything else.
[[example]]
name = "probe"
test = true

[dependencies]
protocol.workspace = true
transport.workspace = true
platform-mac.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
quinn.workspace = true
serde.workspace = true
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-io-surface", "objc2-metal"] }
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3"
block2 = "0.6"
if-addrs = "0.15"
