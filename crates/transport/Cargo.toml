[package]
name = "transport"
version.workspace = true
edition.workspace = true

[dependencies]
protocol.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
tokio.workspace = true
quinn.workspace = true
# For `InvalidCid`, which quinn doesn't re-export. The same crate quinn already pulls in.
quinn-proto = { version = "0.11", default-features = false }
rustls.workspace = true
rcgen.workspace = true
serde.workspace = true
postcard.workspace = true
ring = "0.17"
socket2 = "0.6"
spake2 = "0.4"
# Faster sendmsg_x/recvmsg_x batching on macOS (falls back safely if unavailable).
quinn-udp = { version = "0.5", features = ["fast-apple-datapath"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true
